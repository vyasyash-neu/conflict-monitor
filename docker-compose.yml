services:
  # ── Message Broker (Redpanda - lightweight Kafka) ──
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
      - --smp 1
      - --memory 512M
    ports:
      - "19092:19092"   # Kafka API (external)
      - "8081:8081"     # Schema Registry
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      retries: 5

  # Redpanda Console (optional - nice Kafka UI)
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  # ── Primary Database (PostgreSQL + PostGIS) ──
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres
    environment:
      POSTGRES_DB: conflict_monitor
      POSTGRES_USER: ${POSTGRES_USER:-conflict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conflict_secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conflict"]
      interval: 5s
      retries: 5

  # ── Search Index (Elasticsearch) ──
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 5

  # ── Vector Database (Qdrant) ──
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Go Ingestion Service ──
  go-ingestion:
    build:
      context: ./go-ingestion
      dockerfile: Dockerfile
    container_name: go-ingestion
    environment:
      KAFKA_BROKER: redpanda:9092
      GDELT_POLL_INTERVAL: 15m
      RSS_POLL_INTERVAL: 5m
      ACLED_POLL_INTERVAL: 1h
      SOCIAL_POLL_INTERVAL: 3m
      ACLED_USERNAME: ${ACLED_USERNAME:-}
      ACLED_PASSWORD: ${ACLED_PASSWORD:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      FILTER_COUNTRIES: Iran,Israel,United States,Saudi Arabia,Bahrain,Kuwait,Iraq,Lebanon
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  # ── AI/NLP Processing Pipeline ──
  ai-pipeline:
    build:
      context: ./ai-pipeline
      dockerfile: Dockerfile
    container_name: ai-pipeline
    environment:
      KAFKA_BROKER: redpanda:9092
      GROQ_API_KEY: ${GROQ_API_KEY}
      POSTGRES_URL: postgresql://conflict:conflict_secret@postgres:5432/conflict_monitor
      ELASTICSEARCH_URL: http://elasticsearch:9200
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # ── FastAPI Backend ──
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://conflict:conflict_secret@postgres:5432/conflict_monitor
      ELASTICSEARCH_URL: http://elasticsearch:9200
      QDRANT_URL: http://qdrant:6333
      KAFKA_BROKER: redpanda:9092
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # ── MCP Server ──
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "8100:8100"
    environment:
      API_BASE_URL: http://api:8000
      POSTGRES_URL: postgresql://conflict:conflict_secret@postgres:5432/conflict_monitor
      QDRANT_URL: http://qdrant:6333
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - api
    restart: unless-stopped

  # ── React Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws
    depends_on:
      - api

volumes:
  redpanda_data:
  postgres_data:
  es_data:
  qdrant_data: